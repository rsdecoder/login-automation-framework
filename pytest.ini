[pytest]
# The web application under test. Page objects navigate relative to this,
# so the site can be changed in one place (e.g. for a different environment).
base_url = https://www.saucedemo.com

# Only look for tests in the tests/ folder.
testpaths = tests

# Options applied to every run:
addopts =
    --html=reports/report.html
    --self-contained-html
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --video=retain-on-failure

# --- Logging ---
# Show log messages live in the console during the run.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# Also save a full, timestamped log to a file for later inspection.
log_file = reports/test_run.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
