[pytest]
# The web application under test. Page objects navigate relative to this,
# so the site can be changed in one place (e.g. for a different environment).
base_url = https://www.saucedemo.com

# Only look for tests in the tests/ folder.
testpaths = tests

# Options applied to every run:
addopts =
    --html=reports/report.html
    --self-contained-html
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --video=retain-on-failure
